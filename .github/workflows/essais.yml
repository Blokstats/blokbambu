name: Essais

on:
  push:
  workflow_dispatch:

jobs:
  essais:
    name: ${{ matrix.systeme }}
    runs-on: ${{ matrix.systeme }}
    strategy:
      fail-fast: false
      matrix:
        systeme: [macos-latest, ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Les copies installées apprennent qu'une version est parue en lisant version.txt : quand un
      # fichier installé change, son numéro doit monter, sinon personne n'est prévenu.
      - name: Le numéro de version monte avec les fichiers installés
        if: runner.os == 'Linux' && github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          modifies=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" || true)
          if echo "$modifies" | grep -qxE 'compteur\.py|page\.html|police\.woff2|alerte\.swift'; then
            avant=$(git show "${{ github.event.before }}:version.txt" 2>/dev/null | head -1 || echo 0)
            apres=$(head -1 version.txt)
            echo "version : ${avant:-0} -> $apres"
            [ "$apres" -gt "${avant:-0}" ] || { echo "Un fichier installé a changé : montez le numéro de version.txt."; exit 1; }
          fi

      - name: Le compteur, sur de fausses données et une fausse imprimante
        run: python tests/essais.py

      # Les installeurs sont lancés comme chez un ami, puis on vérifie que le compteur installé
      # compte une impression, et que le retrait ne laisse rien tourner.
      - name: Installation et retrait (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:BLOKBAMBU_DISCRET = "1"
          $env:BLOKBAMBU_SOURCE = "$PWD"
          Invoke-Expression (Get-Content -Raw -Encoding UTF8 installer.ps1)
          python tests/essais.py --installe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:BLOKBAMBU_ACTION = "retirer"
          Invoke-Expression (Get-Content -Raw -Encoding UTF8 installer.ps1)
          python tests/essais.py --retire
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Installation et retrait (Linux)
        if: runner.os == 'Linux'
        run: |
          sh installer-linux.sh --discret
          python tests/essais.py --installe
          sh installer-linux.sh --retirer
          python tests/essais.py --retire

      - name: Installation et retrait (macOS)
        if: runner.os == 'macOS'
        run: |
          swiftc -O alerte.swift -o "$RUNNER_TEMP/alerte"
          zsh installer.sh --discret
          test -x "$HOME/Library/Application Support/BlokBambu/alerte"
          python tests/essais.py --installe
          zsh installer.sh --retirer
          python tests/essais.py --retire
